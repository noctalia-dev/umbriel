name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(<VERSION)
          if [[ -z "$version" || "$version" == *$'\n'* ]]; then
            printf 'VERSION must contain one non-empty line.\n' >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %q does not match VERSION %q.\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            printf 'GitHub release %s already exists.\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes
